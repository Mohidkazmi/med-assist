# docker-compose.yml for AI Medical Scribe Platform

services:
  # =========================================================================
  # PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: med_assist_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume for persistent database storage
      - postgres_data:/var/lib/postgresql/data
      # SQL script mounted to initialize DB schemas/users on first startup
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Verifies the Postgres server is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - med_assist_net

  # =========================================================================
  # Backend API Service (FastAPI)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: med_assist_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind mount backend folder to container to enable hot-reloading in dev
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    healthcheck:
      # Zero-dependency healthcheck using Python's standard library
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - med_assist_net

  # =========================================================================
  # Frontend Application Service (React + Vite)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: med_assist_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      # Bind mount frontend folder to container for hot-reloading in dev
      - ./frontend:/app
      # Prevent overwriting container node_modules with host node_modules
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001/api/v1}
    depends_on:
      - backend
    networks:
      - med_assist_net

  # =========================================================================
  # pgAdmin Database Management GUI Service
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:8.8
    container_name: med_assist_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      # Named volume for persistent pgadmin configuration (saved server connections)
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - med_assist_net

# =========================================================================
# Volumes and Networks Definitions
# =========================================================================
volumes:
  # Host-managed persistent storage directories
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  # Custom bridge network for isolated service-to-service communication
  med_assist_net:
    driver: bridge
